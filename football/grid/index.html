<body>

<!-- The shared bar. The burger and the wordmark are inserted by
     shared/xi-chrome.js; only this game's own control is written here. -->
<header class="xic-bar">
  <div class="xic-right">
    <button class="xic-ghost" id="gdHowTo" data-optional>How to play</button>
  </div>
</header>

<main class="gd-wrap">

  <!-- ONE H1, first in the body, saying what the game is. The masthead is
       furniture; this is the heading a screen reader and a crawler read. -->
  <h1 class="sr-only">Grid XI &mdash; the daily football grid</h1>

  <!-- THE BOARD'S IDENTITY, AND IT IS THE WHOLE CLUE. There is nothing else on
       the page to work from: no definitions, no enumeration beyond the length
       of each entry, and nothing revealed at the start. The owner's ruling,
       6 September 2026 — "it should just be the title, i.e. what are we trying
       to solve". -->
  <section class="gd-ident" id="gdIdent">
    <p class="gd-kicker" id="gdKicker">TODAY</p>
    <h2 class="gd-title" id="gdTitle">&mdash;</h2>
    <p class="gd-sub" id="gdSub">Eleven names. Type a full name into an entry.</p>
  </section>

  <!-- THE TURNS. Shared across the board, not three per entry: a wrong answer
       spends one and a right answer hands one back, so knowing the board keeps
       you playing and guessing is what the count presses on. -->
  <section class="gd-budget" aria-live="polite">
    <div class="gd-bar" id="gdBar"><i></i></div>
    <p class="gd-count"><span id="gdTurns">&mdash;</span> <small>turns left</small></p>
  </section>

  <div class="gd-boardwrap"><div class="gd-board" id="gdBoard"></div></div>

  <!-- THE SAME STATE, BIGGER. The grid is small enough on a phone that a mark
       on a cell is hard to read; this row is the selected entry alone, at a
       size that can be read at a glance. It is a second RENDERING of one
       state, never a second copy of it. -->
  <p class="gd-lbl" id="gdSlotCap">&mdash;</p>
  <div class="gd-slots" id="gdSlots"></div>

  <p class="gd-lbl" id="gdKbdCap">Letters</p>
  <div class="gd-kbd" id="gdKbd"></div>

  <p class="gd-msg" id="gdMsg" role="status" aria-live="polite"></p>

  <p class="gd-lbl">The eleven</p>
  <div class="gd-entries" id="gdEntries"></div>

  <div class="gd-hist" id="gdHist"></div>

  <!-- Full time. Written by the page when the server says the round is over. -->
  <section class="gd-ft" id="gdFullTime" hidden></section>

</main>

<!-- THE SHARED FOOTER, AT TOP LEVEL. It carries the family disclaimer. -->
<footer class="xic-foot"></footer>
