<body>

<header class="xic-bar"></header>
<h1 class="sr-only">Who Am I XI &mdash; the daily football identity puzzle</h1>

<!-- THE LANDING, which every game in the family opens on: today, and the ones
     that have gone. No third card, because this game has a board a day and
     nothing else — inventing one would be furniture pretending to be a feature. -->
<main class="site-wrap" id="waHome">
  <div class="site-grid">
    <div class="site-main">
      <button class="home-choice hero" id="waToday" type="button">
        <span class="hc-kicker" id="waTodayKicker">TODAY</span>
        <span class="hc-title">Today&rsquo;s eleven</span>
        <span class="hc-note">Eleven club doors, one hidden player behind each.
          Pick your club, take one spell of his career, and name him.</span>
        <span class="hc-state" id="waTodayState"></span>
      </button>
    </div>
  </div>

  <div class="site-sec">More to play</div>
  <div class="site-row">
    <a class="home-choice col" href="/football/whoami/archive/">
      <span class="hc-kicker">PAST BOARDS</span>
      <span class="hc-title">Every board that has gone</span>
      <span class="hc-note">One address each, and they stay playable.</span>
    </a>
  </div>
</main>

<!-- Hidden with the HTML hidden ATTRIBUTE rather than a class, so it is hidden
     to a screen reader as well and not merely invisible. -->
<div id="waGame" hidden>
<main class="app">

  <div class="boardHead">
    <span class="bh-no" id="boardNo"></span>
    <span class="bh-date" id="boardDate"></span>
  </div>

  <!-- ---- choosing a door ---- -->
  <section class="screen" id="screenDoors">
    <p class="lede" id="lede">Pick a club. One player behind each door, and you get one
      go at him.</p>
    <div class="doors" id="doors" role="group" aria-label="Choose a club"></div>
    <!-- THE DAY'S CAREER LENGTHS, SORTED AND UNATTRIBUTED. In slot order these
         would say how many clubs each door's player had, which narrows eleven
         doors to a handful. Sorted, they are a shape of the day. -->
    <p class="careers" id="careers"></p>
  </section>

  <!-- ---- playing one ---- -->
  <section class="screen" id="screenPlay" hidden>
    <div class="doorHead">
      <span class="dh-club" id="playClub"></span>
      <span class="dh-left" id="playLeft"></span>
    </div>

    <!-- The match clock and what the board is worth at this minute. Both are
         the SERVER's numbers; this displays them and never decides them. -->
    <div class="strip" aria-hidden="true"><div class="stripFill" id="stripFill"></div></div>
    <div class="matchHead">
      <span class="clock"><span id="clockValue">0</span><span class="prime">&#39;</span></span>
      <span class="worthBox">
        <span class="label">Worth now</span>
        <span class="worthVal" id="worthNow">114</span>
      </span>
    </div>

    <div class="clues" id="clues"></div>

    <div class="ladder" id="ladder"></div>

    <div class="guessRow">
      <input id="guessInput" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="words" spellcheck="false"
             placeholder="Name him" aria-label="Name the player">
      <button class="kick" id="guessGo" disabled>Name him</button>
    </div>
    <div class="suggest" id="suggest" role="listbox" aria-label="Matching players"></div>

    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <p class="tries" id="tries"></p>

    <!-- Leaving the pitch. Not a substitution and not on the ladder: it ends
         the board at nothing, so it sits apart from the things you buy. -->
    <button class="giveup" id="giveUp">Give up</button>
  </section>

  <!-- ---- what it came to ---- -->
  <section class="screen" id="screenDone" hidden>
    <div class="eyebrow" id="doneKicker">Full time</div>
    <div id="doneBody"></div>
    <div class="share">
      <textarea id="shareText" rows="7" readonly aria-label="Shareable result"></textarea>
      <button class="btn" id="copyShare">Copy result</button>
    </div>
    <button class="btn quiet" id="backToDoors">Back to the board</button>
  </section>

</main>
</div>

<footer class="xic-foot"></footer>
