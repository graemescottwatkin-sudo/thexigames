# Nightly — is the site about to serve a bad board?
#
# The other workflow runs on push, which is the wrong trigger for the failure
# that actually reaches players: every game hands out a different board at
# midnight UTC with NO deploy. A schedule that runs out, a board short of
# eleven, a word with no placement — none of that involves a code change, and
# nothing in this repo would have caught it.
#
# So this runs on a clock instead. It asks production's own /api/preflight,
# which walks the next fortnight of every game's schedule and answers with
# verdicts — never boards. See functions/_lib/preflight.js.
#
# WHY NOT ADMIN. It was asked for and refused: the admin route also exports
# plays.csv and reports.csv and accepts mutations, and this is a public repo.
# The preflight secret gives up one fact if it leaks — whether the next
# fortnight is well formed — and can be rotated without touching a session.
name: Nightly

on:
  schedule:
    # 01:10 UTC: after midnight has rolled the boards over, and early enough
    # that a problem found has the whole day to be fixed before the NEXT
    # rollover puts it in front of anybody.
    - cron: "10 1 * * *"
  # So it can be run by hand the moment somebody imports a new schedule,
  # rather than waiting for the small hours to find out whether it took.
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to check"
        required: false
        default: "14"

jobs:
  preflight:
    name: The coming fortnight is well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install: this script uses fetch and nothing else. The repo has no
      # package.json on purpose and this job must not be the one that adds a
      # reason for one.
      - name: Ask production
        env:
          PREFLIGHT_SECRET: ${{ secrets.PREFLIGHT_SECRET }}
          DAYS: ${{ github.event.inputs.days || '14' }}
        run: node tools/preflight_live.mjs

      # IS EVERY GAME LIVE ON THE TAG ITS GATE RECORDS?
      #
      # post_deploy is step 6 of the deploy sequence and it is a write somebody
      # has to remember. Nothing made forgetting VISIBLE, so on 17 Sep 2026
      # three pushes went out without it, LAST_SHIPPED went ten hours stale, and
      # the gate — which compares changed bytes against LAST_SHIPPED — read a
      # second, different build under an already-shipped tag as a legitimate
      # bump. A broken script reached players under a URL marked immutable for a
      # year, while the live_check passed because BUILD read the same in both.
      #
      # Here rather than in checks.yml deliberately: on a push, CI and the Pages
      # deploy race, so "live" is sometimes the old tag and sometimes the new
      # one and the check would have to tolerate both — which tolerates the
      # exact state being hunted. Hours after a deploy there is no race and the
      # resting state is exact.
      #
      # `if: always()` so a red preflight above does not hide this: two
      # independent questions, two answers.
      - name: Every game is live on the tag its gate records
        if: always()
        run: node tools/shipped_check.mjs
