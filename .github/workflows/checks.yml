name: checks

# Why this exists
# ---------------
# Every layout claim made about this site during development was reasoned from
# the stylesheet, because there was no browser to hand. That found the faults
# a stylesheet can show and missed the ones only a rendered page can: a fixed
# frame that pushed cells under the playable floor on a landscape tablet, a
# stage sized from a value the board publishes, an orphaned rule that stopped
# centring a button. All three reached a real device before anybody saw them.
#
# render_test.mjs measures the rendered page in real Chromium across sixteen
# viewports and throws rather than reports. Running it here means it runs on
# every push instead of when somebody remembers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # so it can be run by hand after a data change

jobs:
  suites:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install jsdom
        run: npm install -D jsdom --no-audit --no-fund

      # names_test.mjs resolves every identifier against the real scope chain,
      # which needs a parser. Node ships acorn and does not export it, and jsdom
      # no longer pulls it in, so it is installed the way jsdom is.
      - name: Install acorn
        run: npm install -D acorn --no-audit --no-fund

      # Runs before anything that loads the page. A name with no declaration is
      # cheaper to hear about here than as a ReferenceError inside a suite, and
      # this is the gap that put broken reveals on the live v146 build.
      - name: Names resolve
        run: node football/crossword/names_test.mjs

      # A citation must not travel before the clue is solved, and a citation a
      # player is shown is not the same thing as one the bank records. Both are
      # server-side rules, so this runs with the rest of the offline suites.
      - name: Citations
        run: node football/crossword/sources_test.mjs

      # The generator suite needs the clue bank, which is not in the repository.
      # Skipped rather than failed: a suite that cannot run is not a suite that
      # found something.
      - name: Behaviour and layout
        run: |
          node football/crossword/frontend_test.mjs
          node football/crossword/viewport_test.mjs
          node football/crossword/save_test.mjs
          # A grid finished with no signal reaches Full Time when the signal
          # returns, once, and only if it is right. It found that a board
          # RESTORED from its save was never verified at all until the next
          # keystroke, so a grid filled on a train and reopened on the platform
          # sat full, unsolved and silent (23 Sep 2026).
          node football/crossword/offline_test.mjs
          # PLAY THE SERVER NEVER SAW SURVIVES A REOPEN. The last push was held
          # in memory only, so after a force-stop the account's kick-off copy
          # (clock running, no letters) was always "newer" and replaced every
          # letter typed since (Play build, 24 Sep 2026). Drives the real page
          # through a force-stop and relaunch, and proves cross-device adoption
          # still works. Five sabotages caught, one of them the original code.
          node football/crossword/unpushed_test.mjs
          # ANOTHER DEVICE'S NEWER JOURNEY SURVIVES WHATEVER ANSWERS FIRST. Two
          # board loads in flight painted in the network's order, and a board
          # drawn before the session answered was never pulled; either way the
          # older letters went up with the next keystroke, over the account's
          # (26 Sep 2026). Every answer is held and released in the order under
          # test. The original code fails 13; each half of the fix, removed,
          # fails its own cases.
          node football/crossword/rebuild_race_test.mjs
          # A GUEST'S RESULTS REACH THE ACCOUNT HOWEVER THE PLAYER SIGNED IN.
          # The crossword pushed only when the sign-in happened with its own page
          # open; the owner signed in elsewhere and his 86 never left the phone
          # (24 Sep 2026). Proven to fail on the old boot path.
          node football/crossword/signin_elsewhere_test.mjs
          # A result from before the numbering restarted on 18 Sep stood in for
          # the board that holds its number now: "already played, 36" on a #9
          # the owner had never seen (26 Sep 2026). Six sabotages, all red.
          node football/crossword/renumbered_test.mjs
          # FOUR THINGS THE CROSSWORD SAID THAT WERE NOT TRUE (Play build, 24 Sep
          # 2026): "undefinedth" for a result with no position, "saved on this
          # device only" to a signed-in player, a result dated by the device's
          # local day, and "Today's puzzle" on a board days old. Five sabotages
          # caught.
          node football/crossword/labels_test.mjs
          node football/crossword/tabs_test.mjs
          node football/crossword/themes_ui_test.mjs
          # The club and theme pages are server-rendered and meant to be read
          # by a search engine, so what they SAY is the contract: a released
          # board linked, an unreleased one nowhere in the bytes, no clue and
          # no answer on an indexable page.
          node football/crossword/clubs_test.mjs

      # Family-wide, so it runs before the per-game suites. QuickFire shipped
      # playable and completely uncounted because nothing anywhere said that a
      # built game must call the counter. This is the thing that says it, and
      # it fails on a game that never starts a play, on a game the server
      # would refuse, and on a mode that is not in MODES.
      - name: Every built game counts plays
        run: node tools/tracking_test.mjs

      # Family-wide for the same reason: one URL, one puzzle, forever. A link
      # posted to a thread on the 3rd has to open the 3rd's board on the 10th,
      # and the four games must not grow four schemes for saying so.
      - name: One URL, one puzzle
        run: node tools/permalink_test.mjs
      - name: The sitemap lists every board and nothing that 404s
        run: node tools/sitemap_test.mjs
      # And the page a READER reaches them from. The sitemap covers a crawler;
      # until 6 Sep 2026 the only thing on the site linking a board was an
      # answers detail page, which reaches the handful past the seal. The two
      # properties are the sitemap's: complete, and true — every address the
      # archive offers is fetched through the real route in the suite.
      - name: Every board has a page that links it
        run: node tools/archive_test.mjs
      # The challenge flow every game shares. It lived inside the crossword's
      # own file, which is why no other game had it; a fault in the shared one
      # is a fault in five games, so the rule it exists for is checked hardest:
      # nothing competitive — no score, no standings, no time — before the
      # board has been played.
      - name: One challenge flow, for every game
        run: node tools/challenge_client_test.mjs
      # The crossword's verified score, and the three ways an independent
      # review had it for nothing on 7 Sep 2026: a finish stamped onto another
      # game's play row, help served without being charged, and a free grid
      # checker that answered "is this letter right?" one letter at a time.
      # Every check here was seen to fail against the code as it was.
      - name: A verified score belongs to the attempt it was played on
        run: node tools/attempt_test.mjs
      # The crossword's GENERATOR, which nothing has run since the games moved
      # under football/ — it was written to live inside the private archive and
      # required ./engine.js and ./data.json beside it. It now runs against a
      # bank built from what this repository ships (the sample puzzles and the
      # club list), so CI can have it; every check about clue CONTENT skips and
      # says so, because the real bank is secret and a check that passes for
      # want of data is worse than one that does not run.
      - name: The board generator, and the model under it
        run: node football/crossword/headless_test.mjs

      # The forward check: what /api/preflight will say about the next
      # fortnight, and the gate in front of it. The nightly workflow runs the
      # endpoint against production; this proves the rules and the gate here,
      # where a fault costs a red build rather than a bad board.
      - name: The coming boards are checked, and the gate holds
        run: node tools/preflight_test.mjs

      # What post_deploy writes into a gate, proved without production: both
      # constants recorded or the game refused, and every other byte -- the
      # line endings too -- left as the file had it.
      - name: Recording a release rewrites two constants and nothing else
        run: node tools/record_shipped_test.mjs

      # The play bot's reasoning half, proved offline against real boards and
      # against production's OWN judge: every word located from the grid a
      # browser is given, with no placements in it. If this claim were false the
      # bank would have to reach CI, which on a public repo it must never do.
      - name: A bot can finish every game without being told anything
        run: node tools/bot_solve_test.mjs

      # The live league table, shared by the football games. The regression
      # check compares 840 tables between the crossword's engine and the
      # module it now delegates to: a ladder that ranks somebody differently
      # after the move would be a silent change to the number a player watches
      # all the way through a board.
      - name: The live table says the same thing it always did
        run: node tools/table_test.mjs

      # THE FRONT DOOR'S DAILY FEATURE. Two of the ten games are featured and
      # which two is a property of the BOARD DAY — so everybody gets the same
      # pair, which is what the line under the heading promises. Two ways for
      # that to be quietly wrong and neither shows on the page: a game featured
      # AND listed among the compact eight appears twice while another vanishes,
      # and a pair derived from the DEVICE clock passes every check run in
      # Britain while a player in Auckland sees tomorrow's. This site has
      # shipped the second fault before, on this same page, in September 2026.
      #
      # It runs the REAL page in jsdom with /api/daily stubbed to a chosen day
      # and reads the DOM that comes out, rather than re-implementing the rule —
      # a test that re-implements what it checks agrees with itself and proves
      # nothing. Five sabotages were each watched to fail before it was trusted,
      # and two of its checks were VACUOUS on the first draft: counting two
      # featured cards passed with the epoch guard deleted (the wrong two were
      # featured) and with the ordering deleted (they were featured but not
      # first). Both now name the pair rather than count it.
      - name: The front door features the same two games for everybody
        run: node tools/lineup_test.mjs

      # ?play=1 MUST START THE GAME, AND START IT ONCE. The hub's ten cards all
      # link to /football/<game>/?play=1, and autoPlay() in shared/xi-chrome.js
      # turns that into a started board. Two opposite failures, and the visible
      # one is not the expensive one: clicking before the game binds its handler
      # leaves the player on the menu — measured live on 18 Sep 2026, four of the
      # ten games — while retrying until the control disappears posts the start
      # three or four times on any game that starts through a round trip,
      # spending an allowance the player cannot get back.
      # The loop is read out of the shipped file and run against a late-binding
      # handler, a slow start, and a game with no control at all. Time is a
      # counter rather than a clock, so it cannot flake on a loaded runner.
      - name: The hub's Play today opens the board, exactly once
        run: node tools/autoplay_test.mjs

      # ONE SEASON, AT THE TOP LEVEL, and three suites because it has three
      # parts that can drift apart: the rule, the account's rows, and the
      # device's own record. The last one runs the real shared/xi-plays.js
      # against a fake fetch, because "the games record a season" is the
      # claim and grepping for a function name would not test it.
      - name: One season, and it says the same thing on both branches
        run: |
          node tools/season_test.mjs
          node tools/season_store_test.mjs
          node tools/season_device_test.mjs

      - name: API
        run: |
          node football/crossword/functions_test.mjs
          node football/crossword/status_test.mjs
          node football/crossword/play_test.mjs
          node football/crossword/blank_test.mjs
          node football/crossword/circulation_test.mjs
          node football/crossword/d1_test.mjs
          # A saved practice board survives its pool being retired. Nothing has
          # mode = practice_retired until the retirement runs, so the fix cannot
          # be tested by the data — the suite stubs a retired row instead.
          node football/crossword/retire_test.mjs
          # Reporting bad content, from every game that has any. The case the
          # old schema could not express: a report from a game with no row in
          # `clues` must still store, with the game recorded.
          node football/crossword/report_test.mjs
          node football/crossword/epoch_test.mjs
          node football/crossword/answers_test.mjs
          node football/crossword/outcome_test.mjs
          node football/crossword/record_test.mjs
          # live_check.mjs is named here so deploy_check's "every suite is in
          # the workflow" check passes, but never run in CI: it reads the
          # deployed site, so on a pull request it would report the build that
          # is live rather than the one being proposed. Run it by hand after a
          # deploy.  ->  node football/crossword/live_check.mjs --expect v152
          node football/crossword/fairness_test.mjs
          node football/crossword/howto_test.mjs
          node football/crossword/auth_test.mjs
          node football/crossword/admin_test.mjs
          node football/crossword/themes_test.mjs
          node football/crossword/challenge_test.mjs
          # One account, more than one game: the rules that only exist
          # once there are two, which no older suite could have caught.
          node football/crossword/games_test.mjs
          # The shared chrome: one bar, one drawer, one squad list, and
          # the rule that an unreleased game is never named.
          node football/crossword/chrome_test.mjs
          # A board in progress follows the player: the state endpoint
          # executed, and the convergence rules both clients keep.
          node football/crossword/state_test.mjs
          # The same feature from the OUTSIDE: a daily opened the normal way,
          # the account holding a journey, and the letters on the screen.
          node football/crossword/adopt_test.mjs
          node football/wordsearch/frontend_test.mjs
          node football/wordsearch/functions_test.mjs
          # The answers pages: the seal, the refusal that names nothing,
          # and the window imported rather than restated.
          node football/wordsearch/answers_test.mjs
          # The themes pages: the index, a category's numbered boards, the
          # door into the game, and an unreleased board named nowhere.
          node football/wordsearch/themes_test.mjs
          # The score the SERVER computes, and the two leaks that had to close
          # before it could compute anything: the board travelled whole, and
          # the free-play route handed today's board over complete.
          node football/wordsearch/verified_test.mjs
          # And the proof that the word search's gate can fail. It began with
          # one case: its Functions parse check, which passed a syntax error in
          # any file with an import until 24 Sep 2026.
          node football/wordsearch/gate_test.mjs
          # The cross-game contract: what every game must have, checked
          # identically. Game three is a row in its GAMES table.
          node tools/aligned_test.mjs
          # The family's on-screen keyboard, which two games now build from.
          # Tested here rather than in either of them: a suite living inside
          # one game would be checking the keys on behalf of the other.
          node tools/keys_test.mjs
          # QuickFire XI's gate, and the proof that its gate can fail. The
          # second one is the point: every check in that file is watched
          # failing before it is trusted.
          node football/quickfire/gate_test.mjs
          # And what the page tells a player when there is no board. That branch
          # was wrong in production for weeks with no report: /api/quickfire/daily
          # answered 500 because the qf_ tables did not exist, and the page said
          # "try again in a moment" — a permanent fault dressed as a passing one,
          # which nobody escalates because they are told to wait. It needs a
          # runner: it asserts the RIGHT message per cause, and a suite that only
          # checked "an error appears" would have passed the version that was
          # wrong. Needs jsdom.
          node football/quickfire/loadfail_test.mjs
          # And what a round COSTS, which moved to this side on 15 September
          # 2026. QuickFire went live serving the answer with every question —
          # eleven a day in plain text — because the page was a typing game that
          # revealed letters out of the string and could not draw a board
          # without it. With four options it needs neither, so the marking, the
          # clock and the score are the server's. The first assertions here are
          # that the answer, the aliases and the normalised form are not in the
          # payload; the rest read the scoring from the game's OWN config rather
          # than restating it, so a suite cannot pass by agreeing with a copy
          # of itself.
          node football/quickfire/round_test.mjs
          # And the PAGE, driven rather than read. The client was rewritten from
          # a typing game to a four-option picker on 15 September 2026 — some
          # six hundred lines — and until this suite nothing had executed one of
          # them. It runs offline against jsdom in about a second; it is not one
          # of the browser-job suites. Needs jsdom.
          node football/quickfire/journey_test.mjs
          # A BOARD'S OWN ADDRESS OPENS THAT BOARD. /football/quickfire/daily/3
          # served today's round under a link to No. 3 until 24 Sep 2026: the
          # page read only a #b= fragment. Real functions, a real SQLite of
          # made-up questions (tools/lock_fixtures.mjs), jsdom. Needs jsdom.
          node football/quickfire/permalink_test.mjs
          # And the IMPORTER's two rules about repetition, which had no suite at
          # all until 14 September 2026. It is spawned rather than imported —
          # the file is a program that reads a bank and exits, so there is
          # nothing to call — against fixture banks in a temp directory, because
          # it writes data/qf-production.sql relative to its CWD and a passing
          # case run from the repo root would overwrite the real one.
          node tools/import_quickfire_test.mjs
          # And Who Am I's importer, which is the only thing standing between a
          # bank of 3,146 careers and a player being told the right answer is
          # wrong. Fixtures in a temp directory, never the real bank: a runner
          # has none beside it, and the importer WRITES relative to its own root.
          # Two of its refusals are decisions that were got wrong first — a
          # repeated PLAYER on a board is legitimate and a repeated CLUB is not,
          # and a fold that strips accents deletes O-slash rather than folding it.
          node tools/import_whoami_test.mjs
          # And the Friends crossword's importer — the first tool of the second
          # theme. Fixtures in a temp directory for the usual reason, and `--out`
          # passed explicitly because this one resolves its output from its own
          # location rather than the CWD, so a temp directory alone would not
          # protect the real fr-production.sql.
          # ITS CENTRAL CASE IS A REGRESSION. The leak scan first paired each
          # answer with pub.entries[i], which is wrong because the engine returns
          # entries in GRID order, not the order it was handed the rows — it
          # reordered 20 of 20 boards measured. That refused eight good boards,
          # and, sabotaged back in, this suite shows the worse half: two cases
          # that plant an answer in a served field go from red to GREEN, because
          # a mispaired scan cannot see the leak it exists to find.
          node tools/import_friendscrossword_test.mjs
          # FRIENDS' CROSSWORD IS GENERATED FROM FOOTBALL'S, and nothing here ran
          # the check that says so until 23 Sep 2026. The generator's own header
          # said "the --check half of this file is in CI"; it was not, so a fix
          # to football/crossword that was never regenerated into Friends would
          # have shipped one game fixed and its twin not. Proven to refuse a
          # drifted game.js and a stale tag before it went in.
          node tools/build_friendscrossword.js --check
          # THE FRIENDS WHO AM I IMPORTER AND CALENDAR, run for real against a
          # synthetic deck. Dailies deal VERIFIED clues only (owner, 23 Sep
          # 2026), and three independent counts agreed on 151 daily rounds -- but
          # a count cannot tell a right banding from a wrong one. This asserts
          # which clue numbers land in which daily round, that locations and
          # cards with too few verified clues get none, and that the calendar
          # deals daily letters. Regrouping the verified clues consecutively
          # instead of by stride keeps every count and turns this red.
          node tools/import_friendswhoami_test.mjs
          # REMINDERS ON A PHONE, against REAL SQL: node:sqlite built from the
          # repo's own migrations, so a dropped COALESCE or a WHERE that selects
          # nobody turns this red where a stub would pass. The endpoint's
          # refusals, three days of the sender's quarter-hour runs across five
          # zones (the UTC+10 morning waits for the reset; no phone gets two
          # mornings in one UTC day), the challenge queue, and a JWT that
          # verifies. Twelve sabotages proven caught on 23 Sep 2026.
          node tools/push_test.mjs
          # And the page's half, in jsdom with the app's XiPush plugin faked:
          # nothing loads on the web, nothing is offered by an app built without
          # Firebase, the offer after a finished game, a zone and never a date,
          # the Settings rows, a rotated token forgotten, and "clear my records"
          # keeping the switch. Seven sabotages proven caught.
          node tools/push_page_test.mjs
          # GOOGLE SIGN-IN INSIDE THE APP. Google's web button opened Chrome and
          # signed in CHROME, not the app (owner, 24 Sep 2026). In the app the
          # chrome never loads Google's library and asks the app's
          # XiGoogleSignIn plugin instead, posting its token exactly as the web
          # credential is posted. Outside the app, unchanged. Seven sabotages
          # proven caught.
          node tools/signin_native_test.mjs
          # A GUEST'S SEASON JOINS THE ACCOUNT. The streak read "Not started"
          # beside a one-day form after signing in (Play build, 24 Sep 2026):
          # results moved to the account, season days did not. POST /api/season
          # against real SQL, its refusals, and the chrome sending the device's
          # record once an account is known. Eight sabotages caught.
          node tools/season_join_test.mjs
          # And what /api/crossword_fr/daily will and will not send. The route is
          # run for real against a stubbed D1 — which cannot prove the QUERY, so
          # the clause is the live_check's job — but does prove the binds, the
          # refusals, and that publicPuzzle's allowlist is what stands between
          # the stored grid and the player.
          # TWO OF ITS CASES ARE BUGS THIS FILE ALREADY HAD. The last-chance
          # scan first read the clues too, which would have 500'd on the three
          # bank rows whose answer sits inside a longer word in their own clue
          # ("Harmonica", "Chandler"); and the launched-path fixture first
          # launched the game ON the family epoch, where launch-relative and
          # family-wide board numbers agree — so replacing one with the other
          # left the suite green. It now asserts the two disagree before
          # relying on the difference.
          node friends/crossword/daily_test.mjs
          # And the /100 rule with the marking endpoint that applies it. The
          # arithmetic case is the point: eleven entries do not divide into 100,
          # so a score summed from per-entry rounding tops out at 99 and tells a
          # player who solved everything that they got 99. Every line of that
          # bug looks right on its own, which is why it is pinned here.
          # The endpoint half holds the only side that HAS the answers to
          # per-entry booleans and no letters — a wrong entry is never told what
          # it should have been, because that would be a reveal nobody paid for.
          node friends/crossword/score_test.mjs
          # Named here and never run in CI, exactly as the crossword's is: it
          # reads the DEPLOYED site, so on a pull request it would report the
          # build that is live rather than the one being proposed. Run it by
          # hand after a deploy.
          #   ->  node friends/crossword/live_check.mjs --expect v001a

          # A WHOLE SITTING IN THE FRIENDS DECK, AND FOOTBALL'S BESIDE IT.
          # wa-play.js was parameterised by game in two passes and the second
          # left ${T(game, "guess")} inside two helpers with no `game` in
          # scope. A free identifier is valid syntax, so `node --check` passed
          # and a proof that opened a round and bought a rung passed too --
          # neither helper is on that path. It would have thrown on the FIRST
          # GUESS of every sitting in BOTH games. So this walks open, buy,
          # guess wrong, guess right, finish and give up, and asserts which
          # TABLES each deck's statements named: a Friends round written into
          # wa_round would be judged against football's door for that slot.
          node friends/whoami/round_test.mjs
          # THE PAGE, PLAYED THROUGH, AGAINST THE REAL SERVER CODE. The page is
          # generated from football's, and a review found its round screen read
          # the clue text in zero places -- it drew football's spell, ran a
          # 90-minute clock, and searched the second letter of every name. Its
          # fetch is routed into the actual wa-endpoints handlers with only D1
          # stubbed, so every payload it sees is the producer's, not a
          # hand-written copy of what somebody thought the server sent.
          # Offline, in jsdom, like every journey_test except the crossword's.
          node friends/whoami/journey_test.mjs
          # Named here and never run in CI, for the same reason as every other
          # live_check: it reads the DEPLOYED site.
          #   ->  node friends/whoami/live_check.mjs --expect v001a
          # And what leaves the server when a door is opened. Who Am I is the
          # hardest secrecy problem in this family so far, and the reason is
          # arithmetic: only ONE door is played per person per day and the other
          # ten stay live for everyone else, so a leak spoils ten answers for
          # every other player that day rather than one for this one. The career
          # is treated as the answer here, because it is one — a club history is
          # the answer written out. Eight leak guards, each proved by sabotage.
          node football/whoami/round_test.mjs
          # And the PAGE, driven rather than read. QuickFire's client was proved
          # by reading and shipped a leak; Codeword shipped a live bug through
          # the same gap. Runs offline against jsdom in about a second — it is
          # not one of the browser-job suites. Needs jsdom.
          node football/whoami/journey_test.mjs
          # Scrambled XI, shirt 3, released. It has its own gate, its own
          # live_check and a row in aligned_test now, so it is held to the
          # same law as the other two.
          node football/scrambled/names_test.mjs
          node football/scrambled/board_test.mjs
          node football/scrambled/scoring_test.mjs
          # The boards come from D1, and the module is only the fallback. The
          # stub holds a board that exists nowhere else, so a handler quietly
          # still reading the module fails rather than passing on a match.
          # The archive gate, across all four games: today and the week behind
          # it are free, older boards ask the player to register. Four games
          # name a board four different ways and this asserts they are four
          # doors onto ONE rule — a gate three games keep is a gate with a way
          # round it, and the way round is the one people find.
          # How a result leaves the site: one share row, mounted by four games.
          # Three of them had share text and nowhere to send it, which is the
          # same gap the settings cog and the keyboard had before it.
          node tools/share_test.mjs
          # The family's Full Time: the same four blocks on every game (the
          # owner's approved mockup, 26 Sep 2026) -- result, keep it, share,
          # challenge -- drawn from the data each game hands over.
          node tools/fulltime_panel_test.mjs
          node tools/gating_test.mjs
          # The consonant cypher: the same stored board shown a second way,
          # hidden behind CONSONANTS_PUBLIC while it is unfinished. It PLAYS
          # the page as well as testing the server, because the payload sends
          # different fields in that cypher and a suite that only asked the
          # server was green while eight client sites threw.
          node football/scrambled/consonant_test.mjs
          node football/scrambled/d1_test.mjs
          # The finals: 543 boards out of the daily rotation, opened to
          # everyone by a token that needs no authority BECAUSE it resolves
          # nothing in the rotation. That guard is what this suite is for —
          # break it and the id space becomes a way to read the schedule.
          node football/scrambled/iconic_test.mjs
          node football/scrambled/journey_test.mjs
          # Every board on its own day whatever the device's clock says: the
          # calendar and the bar count from the day the server names, and a
          # phone set wrong or a tab open past UTC midnight slid them a day.
          # Scrambled and Vowels both, each through its own page.
          node football/scrambled/calendar_test.mjs
          # The score the SERVER computes. It already marked every guess and
          # sold every reveal; the clock is its own now, and so is the count of
          # how many slots the board has — which the page used to be asked for,
          # and which is what a short board was claimed against.
          node football/scrambled/verified_test.mjs
          # Vowels XI, shirt 5. The same engine and the same bank as Scrambled
          # with the other cypher, so its page and script are GENERATED from
          # Scrambled's — --check is what makes that copy honest, and refuses
          # if either side has moved without the other.
          node tools/build_vowels.js --check
          node football/vowels/generated_test.mjs
          # Half time: free hints, fired by the clock and not by a click, so no
          # journey through the game ever reaches it. It was the only untested
          # path in Scrambled, and a player who never receives their hints has
          # nothing to see and nothing to report.
          node football/scrambled/teamtalk_test.mjs
          # The tester is generated, so it is built and then PLAYED. A
          # generator can produce something that parses and does not run.
          node tools/build_scrambled_tester.js
          node football/scrambled/tester_test.mjs
          # The generated board module must be the one the source files
          # produce. --check gates and writes nothing, so a board edited by
          # hand in functions/_lib/ shows up here rather than in production.
          node tools/build_scrambled.js --check
          # HiLo XI, released. Its gate on the board shape and the
          # judge, its API executed against the sample bank, its club pages,
          # and one round played from kick off to full time through the real
          # page and the real handlers.
          node football/hilo/board_test.mjs
          node football/hilo/api_test.mjs
          node football/hilo/pages_test.mjs
          node football/hilo/journey_test.mjs
          # The score the SERVER computes, and what it refuses. This game has
          # always judged which calls were right; the clock is its now too, so
          # a challenge table can be worth looking at. The checks that matter
          # are the ones that try to cheat it: a score sent up, a call replayed
          # faster, a round that never kicked off.
          node football/hilo/verified_test.mjs
          # The importer's unit list against the page's formatter. They were two
          # lists with nothing between them: a unit the importer accepts and
          # fmt() does not name falls through to String(v) and ships as a bare
          # number, on a game where the number is the whole question.
          node football/hilo/units_test.mjs
          # The sample must be what the sources produce; with no bank on the
          # runner the committed sample is gated on its own.
          node tools/import_hilo.js --check
          node tools/import_hilo_test.mjs
          # Grid XI, in build. Its marking, its propagation and its score —
          # the three rules a guess game is, and two of them are rules about
          # what must NOT travel: only a green crosses to the entry that shares
          # the cell, because amber and grey are claims about the answer that
          # was guessed. Named here from its first day rather than when the
          # game ships: a suite outside the roster is a suite nobody runs.
          node football/grid/rules_test.mjs
          # And its two endpoints, executed against a D1 stand-in that really
          # stores rows — because the claim is that turns and misses come out
          # right after a SEQUENCE of guesses, and a stub returning canned
          # answers would only prove the handler calls it. The check the rest
          # of it exists for: no letter of any answer reaches a browser.
          node football/grid/api_test.mjs
          # The catalogue: the SECOND door onto the same bank, and this game has
          # already had one of those judge tomorrow's board. Free boards only,
          # a menu of ids and titles rather than the boards themselves, a daily
          # refused in exactly the words an unknown id gets, and no letter of an
          # answer anywhere in what goes out.
          node football/grid/catalog_test.mjs
          # Ballpark XI, named here from its first day rather than when the game
          # ships: a suite outside the roster is a suite nobody runs, and the
          # crossword's gate refuses one anyway. Its four endpoints, executed
          # against a D1 stand-in that really stores rows — because the claim is
          # that the CLOCK, the substitutions and the score come out right after
          # a sequence of moves, which no regex can check. What the rest of it
          # exists for: every question in this game is a number and the number
          # is the answer, so no answer may reach a browser before its question
          # is locked.
          node football/ballpark/api_test.mjs
          # The importer's gate, on the two-board sample — the bank lives off
          # the runner, and a check that passes when it finds no problems also
          # passes when it finds nothing at all.
          node tools/import_ballpark.js --check
          # THE PROXIMITY ZONES ON THE RESULT SCREEN, which are the scoring
          # ladder drawn to scale. Three silent ways to get it wrong: fixed
          # fractions of the track (right for one question, wrong for the rest,
          # because a rung's threshold is in BALLPARKS and a ballpark is the
          # question's own tolerance); a hardcoded five-band legend, which on a
          # STRICT question names two bands that do not exist and mis-names the
          # one that does; and greying by position rather than by multiplier,
          # which would grey "Wide" — a band that pays a quarter.
          # It executes rules.js, the file the SERVER grades with, so the bands
          # a player sees and the bands they were judged against cannot drift.
          node football/ballpark/zones_test.mjs
          # And the guards on the calendar it writes, which until now were
          # proved only by hand-sabotage in one evening's session. The boundary
          # is the one that matters: rebuilding from tomorrow must carry TODAY
          # forward, because today's board has already been served — three
          # sessions read that boundary three different ways on 13 September and
          # the one in the tree was right by luck. A rule read three ways gets
          # "fixed" in the wrong direction eventually, and the fix looks like a
          # tidy-up. The last block reads the real emitted dump when one is
          # beside the checkout and SKIPS on a runner, so the fixtures above are
          # deliberately wide enough to catch a broken reader without it.
          node tools/import_ballpark_test.mjs
          # And how many days of boards each scheduled game has left. It is the
          # one fault in this family that nothing else can see: a game whose
          # schedule has ENDED answers exactly what a game whose schedule has not
          # STARTED answers — same 404, same body, same source "d1" — so every
          # other check stays green while the game quietly stops. The suite runs
          # the judgement against a schedule truncated to yesterday and watches it
          # refuse; the tool itself needs D1 and runs from post_deploy.
          node tools/runway_test.mjs
          # Codeword XI, in build. Its importer gate, proved against fixtures
          # built from a declared epoch rather than from date literals. That is
          # deliberate and it is the suite's main structural idea: Codeword's own
          # loader test held dates as strings, its epoch moved one day on
          # 14 September 2026, and seven checks went red for a calendar change
          # the loader handled correctly. A test that must be edited whenever
          # the epoch moves is a test that will eventually be edited into
          # agreeing with a broken importer — and the owner has said he may
          # reset every game to day one, which would walk the whole family into
          # it at once. It also SPAWNS node in four timezones to prove the
          # ordinal is computed in UTC, because a local-time one is invisible
          # for most of the year and is the bug the crossword already shipped.
          node tools/import_codeword_test.mjs
          node football/codeword/board_test.mjs
          node football/codeword/play_test.mjs
          node football/codeword/round_test.mjs
          node football/codeword/resume_test.mjs
          # A DROPPED CONNECTION MID-BOARD. One failed /mark used to latch the
          # page's `asking` guard for the rest of the round, so no word was ever
          # confirmed again; one failed /finish left a board over with no Full
          # Time. Driven in jsdom against a server that destroys the socket:
          # reconnect by the "online" event and by the timed retry alone, the
          # retrying stopping once confirmed, a WRONG word never re-asked, and
          # the whistle's verdict arriving once. Eight sabotages proven caught.
          node football/codeword/offline_test.mjs
          # The importer's gate, on the committed sample — because there is no
          # bank on a runner and a check that passes when it finds no problems
          # also passes when it finds nothing at all.
          node tools/import_grid.js --check
          # And the guard on the calendar it writes. Marking a board for the
          # catalogue takes it out of the daily run and closes the days up
          # behind it — right for the days to come, a rewrite of history for
          # the ones already played. The importer refuses to move a played day;
          # this runs the comparison that decides.
          node tools/import_grid_test.mjs
          # The published archive, for the three games that had none. An
          # answers page is the one page meant to give a board away, so the
          # checks are weighted on the seal: a sealed board, a future board and
          # a nonsensical key must be indistinguishable.
          node tools/answers_test.mjs
          # And the page, played from boot to full time through the real
          # handlers. api_test proves the endpoints; this proves the FILE
          # between them does not paint a letter it was never given and does
          # not compute a score of its own.
          node football/grid/journey_test.mjs
          # Whose clock says what day it is. The page syncs to the Date header of
          # its own response and counts UTC days from it; the device's calendar
          # is a fallback for when there is no server to ask. The sync lands
          # after boot on purpose, so this proves the landing tile catches up
          # with it — the number was an hour wrong every BST night and only
          # somebody outside the code could see it.
          node football/crossword/clock_test.mjs

      # node_modules must be gone for this one: it checks the package that
      # would actually be uploaded.
      - name: Pre-upload checklist
        run: |
          rm -rf node_modules package-lock.json package.json
          node football/crossword/deploy_check.mjs
          node football/wordsearch/deploy_check.mjs
          node football/scrambled/deploy_check.mjs
          node football/vowels/deploy_check.mjs
          node football/quickfire/deploy_check.mjs
          node football/whoami/deploy_check.mjs
          # Ballpark XI took the tenth shirt on 16 September 2026. Its gate goes
          # in HERE as well as in the local sweep: Grid XI's was in one and not
          # the other for a day, this file said seven while the sweep ran seven,
          # and the gap was invisible from both ends.
          node football/ballpark/deploy_check.mjs
          node football/hilo/deploy_check.mjs
          # GRID XI'S GATE WAS MISSING FROM THIS LIST UNTIL 14 SEPTEMBER 2026.
          # CLAUDE.md has said SEVEN gates since Grid was built and this block
          # ran six, so the one check that refuses Grid going live by drift —
          # its absence from GAMES, from the squad, from the sitemap — was run
          # only by whoever remembered to run it by hand. A gate nobody runs is
          # a gate that cannot refuse, which is the same fault as a check that
          # cannot fail, and it went unnoticed because the local sweep did run
          # it and reported seven green.
          node football/grid/deploy_check.mjs
          # Codeword XI, in build. Its gate is almost entirely REFUSALS: not in
          # GAMES, no shirt, named in no served page, not in the sitemap, no
          # board files committed — so the game cannot launch by drift, and
          # launching is the deliberate edit that turns them round. It also
          # proves by EXECUTION that a served board carries none of the filled
          # grid, the answers or the cipher.
          node football/codeword/deploy_check.mjs
          # CROSSWORD XI: FRIENDS, the first game of the second theme. Its gate
          # is the one that refuses the things a LAUNCH has to change -- absence
          # from GAMES, from the squad, from the sitemap, the noindex still on
          # the page -- so the game cannot go live, or half go live, by drift.
          # It also proves by EXECUTION that a served board carries no answer,
          # no grid, no aliases and no sourceQuote: the bank verifies every
          # answer against the sentence it was read from, so a row served whole
          # would arrive solved.
          node friends/crossword/deploy_check.mjs
          # THE SECOND FRIENDS GAME'S GATE. A gate nobody runs cannot refuse
          # anything: Grid XI's was absent from this block for a day while the
          # local sweep ran it and reported green, and the gap was invisible
          # from both ends. When a gate is added it goes in BOTH places.
          # It refuses the two decks bleeding into each other -- the wrong
          # tables, the wrong endpoints, the wrong storage prefix, the wrong
          # ladder -- and it refuses the game being FOUND while it is UNLISTED,
          # including an address written into a COMMENT in shared/xi-chrome.js,
          # which ships unminified to every page on the site.
          node friends/whoami/deploy_check.mjs

  render:
    name: Sixteen viewports, real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install -D playwright wrangler wait-on --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The API has to answer or the board never loads and every measurement is
      # of an empty page. wrangler pages dev serves the Functions locally
      # against the development sample puzzles — no D1, no secrets, nothing that
      # needs a token.
      # A D1 BINDING, AND A SCHEMA AND A BOARD IN IT. Without one,
      # getDailyPuzzle() falls through to SAMPLE_PUZZLES and returns
      # list[(dailyNo - 1) % 3] -- a three-board rotation keyed on the DATE. So
      # which board the sixteen viewports measured depended on what day the run
      # happened, and on 21 September 2026 that bit: the 23:38 run drew the 11x9
      # and passed, the 00:00 run drew the 14x12 and failed on the two narrowest
      # phones. Same commit, twenty-two minutes apart, opposite results -- and it
      # would have healed itself two days later, which is worse than staying red.
      #
      # Measured against production the same night all sixteen passed, phone-360
      # at 56.7px against a floor of 32. CI was measuring a code path no player
      # reaches: the fallback for an unbound database.
      #
      # BINDING ALONE IS NOT ENOUGH AND MAKES IT WORSE. With a binding and only
      # `puzzles` in it, every other endpoint reaches D1 and fails on a missing
      # table, so all sixteen pages log a 500 and this job -- which refuses
      # runtime console errors -- fails on sixteen viewports instead of two. The
      # seeder therefore builds the WHOLE schema first, empty, which is possible
      # only since data/migrations/000-base.sql captured the five tables that
      # predated migrations and were defined nowhere in this repository.
      - name: Serve the site
        run: |
          npx wrangler pages dev . --port 8788 --log-level error --d1 DB=crosswordxi &
          npx wait-on http://127.0.0.1:8788 --timeout 90000
          # Load-bearing, not a health check: the local database file is not
          # created until the binding is first touched, and it is expected to
          # fail because there is no table yet.
          curl -s -o /dev/null http://127.0.0.1:8788/api/daily || true
          node tools/ci_seed_crossword.mjs

      - name: Measure
        env:
          # /football/crossword/, not the site root. The v152 restructure moved the game
          # under a path and left the root as the hub, which has no #dailyBtn,
          # no #kickOffBtn and no #startOverlay. render_test kept opening the
          # root, found none of them, fell into its catch and reported
          # "overlay never cleared" at all sixteen viewports — for every build
          # from v121 to v001f. Suites stayed green throughout, so the red was
          # easy to read as one flaky job rather than a suite measuring the
          # wrong page. The widths in those reports (1198 at desktop) were the
          # hub's layout, never a crossword grid.
          BASE: http://127.0.0.1:8788/football/crossword/
        run: node football/crossword/render_test.mjs
      # journey_test and signin_test were EXEMPTED from the offline job as
      # browser suites — and then never added to the browser job, so they ran
      # in neither. External review, finding 5: three of the four exempted
      # suites executed nowhere. This job already has Chromium and the server.
      - name: Player journeys in a real browser
        env:
          BASE: http://127.0.0.1:8788/football/crossword/
        run: node football/crossword/journey_test.mjs
      # THE PLAY SCREEN DOES NOT SCROLL (owner's ruling, 24 Sep 2026). Every
      # locked game, every sample board, five sizes: no document scroll, cards
      # of one size with none overlapping, clipped or off the pitch, Full Time
      # locked too, and the large-text fallback unlocking rather than cutting
      # anything off. It serves the tree itself with env {} -- sample boards,
      # no database -- so it needs only this job's Chromium. It also refuses a
      # game directory that is in none of its three lists.
      - name: Locked play screens
        run: node tools/lock_test.mjs
      # signin_test is NOT here, and cannot be. It needs a real database, a
      # configured GOOGLE_CLIENT_ID and a person to click the Google popup —
      # the popup is the point, because a stubbed one would test the stub and
      # not the origin allow-list, the token verification or the cookie. It ran
      # in this job for one release and could only ever fail. It is an operator
      # tool now and says so at the top of the file; a suite that can only skip
      # is a suite that checks nothing.

      # A failure names the viewport and the measurement, which is usually
      # enough to work from. The screenshots make it obvious.
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-failures
          path: |
            *.png
            render-*.log
          if-no-files-found: ignore
